destination: docs

url: https://github.com/paulnorthrop/lite

development:
  mode: release

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: mathjax

reference:
  - title: Package
    desc: ~
    contents:
      - "lite-package"
  - title: Model fitting
    desc: ~
    contents:
      - "blite"
      - "flite"
      - "generalisedPareto"
      - "Bernoulli"
  - title: Extreme value inferences
    desc: ~
    contents:
      - "predict.blite"
      - "returnLevel"
  - title: Generics
    desc: ~
    contents:
      - "bliteMethods"
      - "fliteMethods"
      - "returnLevelMethods"
  - title: Log-likelihood adjustment
    desc: ~
    contents:
      - "estfun"
      - "logLikVector"
